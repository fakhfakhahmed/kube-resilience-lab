apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolate-demo-target
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: checkout-api
  policyTypes: [Ingress]
  ingress:
    - from:
        # A podSelector alone restricts sources to this namespace.
        - podSelector:
            matchLabels: {app.kubernetes.io/name: lab-controller}
        - podSelector:
            matchLabels: {app.kubernetes.io/name: prometheus}
      ports:
        - {protocol: TCP, port: 8081}
# Kind's default CNI does not enforce NetworkPolicy. Use a policy-capable CNI
# (for example Calico or Cilium) before claiming network isolation enforcement.
