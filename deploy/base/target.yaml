apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: checkout-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: checkout-api
        app.kubernetes.io/part-of: kube-resilience-lab
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 2
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: target
          image: kube-resilience-lab:local
          imagePullPolicy: IfNotPresent
          command: [node, src/target.mjs]
          ports:
            - {name: http, containerPort: 8081}
          env:
            - {name: HOST, value: "0.0.0.0"}
            - {name: TARGET_PORT, value: "8081"}
            - {name: ENABLE_FAULTS, value: "true"}
            - name: TARGET_TOKEN
              valueFrom:
                secretKeyRef: {name: lab-tokens, key: TARGET_TOKEN}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 1
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 2
            failureThreshold: 1
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-api
spec:
  selector:
    app.kubernetes.io/name: checkout-api
  ports:
    - {name: http, port: 8081, targetPort: http}
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-control
spec:
  # Control/reset remains reachable while readiness removes the work endpoint.
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: checkout-api
  ports:
    - {name: http, port: 8081, targetPort: http}
